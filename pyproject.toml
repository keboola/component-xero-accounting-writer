[project]
name = "xero-accounting-writer"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "freezegun~=1.5.1",
    "keboola-component>=1.6.10",
    "keboola-http-client>=1.0.1",
    "keboola-utils>=1.1.0",
    "mock~=5.1.0",
    "pydantic~=2.0",
    "xero-python==4.0.0",
    "dateparser~=1.2.0",
    "regex==2022.03.02",
    "tenacity~=9.0.0",
    "ratelimit==2.2.1",
    "urllib3~=2.2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=7.4.0",
]

[tool.ruff]
line-length = 120
exclude = [".git", ".venv", "venv", "env", "build", "dist", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "xero-accounting-writer"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "freezegun~=1.5.1",
    "keboola.component>=1.9.0",
    "keboola-http-client>=1.0.1",
    "keboola-utils>=1.1.0",
    "mock~=5.1.0",
    "pydantic~=2.0",
    "xero-python==4.0.0",
    "dateparser~=1.2.0",
    "regex==2022.03.02",
    "tenacity~=9.0.0",
    "ratelimit==2.2.1",
    "urllib3~=2.2.3",
]

[dependency-groups]
dev = [
    "keboola.datadirtest>=2.0.1",
    "keboola.vcr>=0.1.3",
    "pytest>=9.0.0",
    "ruff>=0.15.2",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP"]

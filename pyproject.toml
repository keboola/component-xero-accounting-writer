[project]
name = "xero-accounting-writer"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "keboola.component>=1.11.0",
    "requests>=2.32.0",
    "pydantic~=2.0",
    "xero-python~=4.0.0",
    "tenacity~=9.0.0",
    "ratelimit>=2.2.1",
    "urllib3~=2.2.3",
]

[dependency-groups]
dev = [
    "keboola.datadirtest>=2.0.1",
    "keboola.vcr>=0.1.3",
    "pytest>=9.0.0",
    "ruff>=0.15.2",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP"]
